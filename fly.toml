app = "industrial-safety-isip"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:///./data/industrial_safety.db"
  PYTHONUNBUFFERED = "1"
  PYTHONOPTIMIZE = "2"
  NODE_ENV = "production"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  
  [services.concurrency]
    hard_limit = 20
    soft_limit = 15

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[services]]
  internal_port = 5173
  protocol = "tcp"

  [[services.ports]]
    port = 3000
    handlers = ["http"]
    force_https = true

[checks]
  [checks.alive]
    type = "http"
    interval = "10s"
    timeout = "5s"
    grace_period = "5s"
    method = "get"
    path = "/health"
