app = "isip-platform"
primary_region = "iad"

[env]
  DATABASE_URL = "sqlite:///./data/industrial_safety.db"
  PYTHONUNBUFFERED = "1"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["backend"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[[services]]
  protocol = "tcp"
  internal_port = 5173
  processes = ["frontend"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20

[build]
  builder = "paketobuildpacks/builder:base"
