version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.fast
    container_name: isip-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/industrial_safety.db
      - SECRET_KEY=production-secret-key-change-this
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - isip-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: isip-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - isip-network
    depends_on:
      - backend

networks:
  isip-network:
    driver: bridge

volumes:
  data:
  logs:
  models:
