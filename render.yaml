services:
  - type: web
    name: isip-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements-fast.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./data/industrial_safety.db
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: isip-frontend
    env: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s dist -l 5173
    staticSite: false
    envVars:
      - key: VITE_API_URL
        value: https://isip-backend.onrender.com
      - key: NODE_ENV
        value: production
